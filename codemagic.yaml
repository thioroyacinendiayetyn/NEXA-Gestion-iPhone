workflows:
  ios-unsigned:
    name: NEXA Gestion iOS - Test
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest

    scripts:
      - name: Installer les dépendances
        script: |
          npm ci

      - name: Construire le frontend
        script: |
          npm run build

      - name: Synchroniser Capacitor iOS
        script: |
          npx cap sync ios

      - name: Compiler l'application iOS
        script: |
          xcodebuild \
            -project "$CM_BUILD_DIR/ios/App/App.xcodeproj" \
            -scheme "App" \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - /tmp/xcodebuild_logs/*.log
